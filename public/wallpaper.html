<!doctype html>
<!--
  WorkerW and Wallpaper Engine behavior adapted from XxHuberrr/Mineradio
  4abaa190de42c632365ae4244e041bad16443224 (GPL-3.0-only).
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio Wallpaper</title>
  <style>
    :root{color-scheme:dark;--wall-primary:#d6f8ff;--wall-secondary:#9cffdf;--wall-highlight:#fff0b8}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif}
    canvas{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block}
    .desktop-icon-layer{position:absolute;inset:0;z-index:2;display:none;pointer-events:none;contain:layout paint style}
    .desktop-icon-layer.is-visible{display:block}
    .desktop-icon-layer:not(.is-locked){pointer-events:auto}
    .desktop-icon-item{position:absolute;display:grid;grid-template-rows:56px minmax(0,1fr);place-items:center;gap:5px;padding:7px 6px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(15,18,23,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(18px) saturate(1.22);-webkit-backdrop-filter:blur(18px) saturate(1.22);color:#fff;outline:none;overflow:hidden}
    .desktop-icon-item:disabled{opacity:1}
    .desktop-icon-layer:not(.is-locked) .desktop-icon-item{cursor:pointer}
    .desktop-icon-layer:not(.is-locked) .desktop-icon-item:hover,.desktop-icon-layer:not(.is-locked) .desktop-icon-item:focus-visible{border-color:rgba(255,255,255,.34);background:rgba(27,32,40,.54);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 2px rgba(127,216,255,.36),0 10px 30px rgba(0,0,0,.28)}
    .desktop-icon-glyph{display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 7px 20px rgba(0,0,0,.20);font-size:25px;line-height:1;color:var(--wall-highlight)}
    .desktop-icon-label{max-width:100%;font-size:12px;line-height:1.25;text-align:center;text-shadow:0 2px 5px rgba(0,0,0,.95);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    body.is-paused canvas{filter:saturate(.82)}
  </style>
</head>
<body>
  <canvas id="wall"></canvas>
  <div id="desktop-icon-layer" class="desktop-icon-layer" aria-hidden="true"></div>
  <script src="desktop-icon-layer.js"></script>
  <script>
    'use strict';
    var canvas = document.getElementById('wall');
    var ctx = canvas.getContext('2d', { alpha:false });
    var W = 1, H = 1, dpr = 1;
    var state = {
      enabled:false,fullDesktop:false,desktopIcons:true,title:'Mineradio',artist:'',cover:'',showCover:true,
      playing:false,preset:0,opacity:1,frameRate:30,particleDensity:1,paused:false,systemPaused:false,audioInput:true,
      hostKind:'wallpaper-engine',iconLayout:{visible:false,locked:false,items:[]},
      colors:{primary:'#d6f8ff',secondary:'#9cffdf',highlight:'#fff0b8',glow:'#9cffdf'}
    };
    var coverImg = null, coverSrc = '';
    var particles = [];
    var wallpaperAudioLevel = 0;
    var lastDrawAt = 0;
    var dirty = true;
    var iconLayerApi = window.MineradioDesktopIconLayer || {};
    var iconLayer = iconLayerApi.createDesktopIconLayer ? iconLayerApi.createDesktopIconLayer({
      root:document.getElementById('desktop-icon-layer'),
      onAction:function(detail){
        window.dispatchEvent(new CustomEvent('mineradio-wallpaper-icon-action',{detail:detail}));
      }
    }) : null;

    function finite(value, fallback){
      value = Number(value);
      return isFinite(value) ? value : fallback;
    }
    function clamp(value, min, max, fallback){ return Math.max(min, Math.min(max, finite(value, fallback))); }
    function normalizeFrameRate(value){
      value = finite(value, 30);
      return value <= 26 ? 24 : value <= 45 ? 30 : 60;
    }
    function hexToRgb(hex, fallback){
      hex = String(hex || fallback || '#9cffdf').trim();
      if (/^#[0-9a-f]{3}$/i.test(hex)) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
      if (!/^#[0-9a-f]{6}$/i.test(hex)) hex = fallback || '#9cffdf';
      return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
    }
    function rgba(hex, alpha){
      var color = hexToRgb(hex);
      return 'rgba(' + color.r + ',' + color.g + ',' + color.b + ',' + alpha + ')';
    }
    function rand(seed){ return Math.abs(Math.sin(seed * 3187.917) * 43758.5453) % 1; }
    function targetParticleCount(){
      var base = Math.max(220, Math.round((innerWidth * innerHeight) / 4400));
      return Math.min(900, Math.max(120, Math.round(base * state.particleDensity)));
    }
    function ensureParticles(){
      var target = targetParticleCount();
      while (particles.length < target) {
        var index = particles.length + 1;
        particles.push({seed:index*11.37,x:rand(index),lane:rand(index*5.9),z:rand(index*8.1),size:.6+rand(index*4.2)*2.4});
      }
      if (particles.length > target) particles.length = target;
    }
    function resize(){
      dpr = Math.min(1.35, Math.max(1, window.devicePixelRatio || 1));
      W = Math.max(1, Math.floor(innerWidth * dpr));
      H = Math.max(1, Math.floor(innerHeight * dpr));
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ensureParticles();
      dirty = true;
    }
    function safeCoverSource(src){
      src = String(src || '').trim();
      if (!src || /^(?:javascript|file|vbscript):/i.test(src) || /^(?:[a-z]:[\\/]|\\\\)/i.test(src)) return '';
      return src.slice(0, 524288);
    }
    function setCover(src){
      src = safeCoverSource(src);
      if (src === coverSrc) return;
      coverSrc = src;
      coverImg = null;
      if (!src) return;
      var image = new Image();
      image.onload = function(){ if (coverSrc === src) { coverImg = image; dirty = true; } };
      image.onerror = function(){ if (coverSrc === src) coverImg = null; };
      image.src = src;
    }
    function applyIconState(){
      if (!iconLayer) return;
      var layout = state.iconLayout && typeof state.iconLayout === 'object' ? state.iconLayout : {items:[]};
      iconLayer.update(Object.assign({}, layout, {
        visible:state.fullDesktop && state.desktopIcons && layout.visible !== false,
        locked:state.hostKind === 'mineradio-workerw' || layout.locked === true
      }));
    }
    function applyState(next){
      next = next && typeof next === 'object' ? next : {};
      var allowed = ['enabled','fullDesktop','desktopIcons','title','artist','cover','showCover','playing','preset','opacity','frameRate','particleDensity','paused','systemPaused','audioInput','hostKind','iconLayout'];
      allowed.forEach(function(key){ if (Object.prototype.hasOwnProperty.call(next,key)) state[key] = next[key]; });
      state.colors = Object.assign({}, state.colors, next.colors && typeof next.colors === 'object' ? next.colors : {});
      state.preset = Math.round(clamp(state.preset,0,7,0));
      state.opacity = clamp(state.opacity,.35,1,1);
      state.frameRate = normalizeFrameRate(state.frameRate);
      state.particleDensity = clamp(state.particleDensity,.25,1.5,1);
      state.fullDesktop = state.fullDesktop === true;
      state.desktopIcons = state.desktopIcons !== false;
      state.showCover = state.showCover !== false;
      state.paused = state.paused === true;
      state.systemPaused = state.systemPaused === true;
      state.audioInput = state.audioInput !== false;
      setCover(state.cover || '');
      document.documentElement.style.setProperty('--wall-primary',state.colors.primary || '#d6f8ff');
      document.documentElement.style.setProperty('--wall-secondary',state.colors.secondary || '#9cffdf');
      document.documentElement.style.setProperty('--wall-highlight',state.colors.highlight || '#fff0b8');
      document.body.classList.toggle('is-paused',state.paused || state.systemPaused);
      applyIconState();
      ensureParticles();
      dirty = true;
      return state;
    }
    function drawCover(now){
      if (!coverImg || !state.showCover) return;
      var side = Math.min(innerWidth,innerHeight) * (.42 + Math.sin(now*.21)*.012);
      var x = innerWidth*.5-side*.5;
      var y = innerHeight*.50-side*.5+Math.sin(now*.37)*8;
      ctx.save();
      ctx.globalAlpha = .16 * state.opacity;
      ctx.filter = 'blur(28px) saturate(1.25)';
      ctx.drawImage(coverImg,x-side*.12,y-side*.12,side*1.24,side*1.24);
      ctx.filter = 'none';
      ctx.globalAlpha = .20 * state.opacity;
      ctx.drawImage(coverImg,x,y,side,side);
      ctx.restore();
    }
    function draw(nowMs){
      var now = nowMs*.001;
      ensureParticles();
      var opacity = state.opacity;
      var primary = state.colors.primary || '#d6f8ff';
      var secondary = state.colors.secondary || '#9cffdf';
      var highlight = state.colors.highlight || '#fff0b8';
      var glow = state.colors.glow || secondary;
      var audio = state.audioInput ? wallpaperAudioLevel : 0;
      var bg = ctx.createLinearGradient(0,0,innerWidth,innerHeight);
      bg.addColorStop(0,'#050608');
      bg.addColorStop(.52,rgba(primary,(.10+audio*.04)*opacity));
      bg.addColorStop(1,rgba(secondary,(.08+audio*.05)*opacity));
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,innerWidth,innerHeight);
      drawCover(now);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var cx = innerWidth*.5;
      var cy = innerHeight*.5+Math.sin(now*.28)*innerHeight*.018;
      var rx = innerWidth*(.36+state.preset*.006);
      var ry = innerHeight*(.27+state.preset*.004);
      for (var index=0;index<particles.length;index++) {
        var particle = particles[index];
        var speed = .009+rand(particle.seed)*.021+(state.playing ? .010 : 0)+audio*.018;
        var angle = (particle.x*Math.PI*2+now*speed+Math.sin(now*.07+particle.seed)*.14)%(Math.PI*2);
        var ring = .18+particle.z*.82;
        var wobble = Math.sin(now*(.22+rand(particle.seed)*.18)+particle.seed)*12;
        var x = cx+Math.cos(angle)*rx*ring+Math.sin(now*.11+particle.seed)*24;
        var y = cy+Math.sin(angle*(1+rand(particle.seed*2)*.16))*ry*ring+wobble;
        var twinkle = Math.pow(.5+.5*Math.sin(now*(.50+rand(particle.seed)*.42)+particle.seed),4);
        var radius = Math.max(.7,particle.size*(.8+twinkle*1.2+audio*.45));
        var color = twinkle>.74?highlight:(particle.lane>.55?secondary:glow);
        ctx.globalAlpha = (.045+twinkle*.18+(state.playing ? .035 : 0)+audio*.06)*opacity;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      wallpaperAudioLevel *= .92;
    }
    function animate(nowMs){
      requestAnimationFrame(animate);
      var stopped = state.paused || state.systemPaused;
      if (stopped && !dirty) return;
      var interval = 1000 / state.frameRate;
      if (!dirty && nowMs-lastDrawAt<interval) return;
      lastDrawAt = nowMs;
      draw(nowMs);
      dirty = false;
    }
    function propertyValue(properties,key){
      var property = properties && properties[key];
      return property && typeof property === 'object' && Object.prototype.hasOwnProperty.call(property,'value') ? property.value : property;
    }
    function propertyBoolean(value,fallback){
      if (typeof value === 'boolean') return value;
      var text = String(value).toLowerCase();
      if (value===1||text==='1'||text==='true'||text==='on') return true;
      if (value===0||text==='0'||text==='false'||text==='off') return false;
      return fallback;
    }
    var WALLPAPER_ENGINE_PROPERTY_KEYS = ['preset','opacity','fpstier','cover','particles','pause','audioinput'];
    function applyWallpaperEngineProperties(properties){
      properties = properties && typeof properties === 'object' ? properties : {};
      var patch = {};
      if (Object.prototype.hasOwnProperty.call(properties,'preset')) patch.preset = clamp(propertyValue(properties,'preset'),0,7,0);
      if (Object.prototype.hasOwnProperty.call(properties,'opacity')) { var opacity=finite(propertyValue(properties,'opacity'),100); patch.opacity=clamp(opacity>1?opacity/100:opacity,.35,1,1); }
      if (Object.prototype.hasOwnProperty.call(properties,'fpstier')) { var tier=String(propertyValue(properties,'fpstier')||'').toLowerCase(); patch.frameRate=tier==='low'?24:tier==='high'?60:30; }
      if (Object.prototype.hasOwnProperty.call(properties,'cover')) patch.showCover=propertyBoolean(propertyValue(properties,'cover'),true);
      if (Object.prototype.hasOwnProperty.call(properties,'particles')) { var density=finite(propertyValue(properties,'particles'),100); patch.particleDensity=clamp(density>2?density/100:density,.25,1.5,1); }
      if (Object.prototype.hasOwnProperty.call(properties,'pause')) patch.paused=propertyBoolean(propertyValue(properties,'pause'),false);
      if (Object.prototype.hasOwnProperty.call(properties,'audioinput')) patch.audioInput=propertyBoolean(propertyValue(properties,'audioinput'),true);
      applyState(patch);
      return patch;
    }
    var previousPropertyListener = window.wallpaperPropertyListener;
    window.wallpaperPropertyListener = {
      applyUserProperties:function(properties){
        if (previousPropertyListener && typeof previousPropertyListener.applyUserProperties === 'function') previousPropertyListener.applyUserProperties(properties);
        return applyWallpaperEngineProperties(properties);
      }
    };
    function receiveWallpaperAudio(samples){
      if (!state.audioInput || !samples || !samples.length) return;
      var sum=0, count=Math.min(128,samples.length);
      for (var index=0;index<count;index++) sum+=Math.abs(finite(samples[index],0));
      wallpaperAudioLevel += (clamp(sum/Math.max(1,count),0,1,0)-wallpaperAudioLevel)*.36;
      dirty=true;
    }
    if (typeof window.wallpaperRegisterAudioListener === 'function') window.wallpaperRegisterAudioListener(receiveWallpaperAudio);
    if (window.desktopOverlay && window.desktopOverlay.onWallpaperState) window.desktopOverlay.onWallpaperState(applyState);
    window.addEventListener('resize',resize);
    document.addEventListener('visibilitychange',function(){ dirty=true; });
    window.addEventListener('pagehide',function(){ if(iconLayer) iconLayer.release(); });
    window.__mineradioWallpaperSnapshot = function(){
      return {frameRate:state.frameRate,particleDensity:state.particleDensity,paused:state.paused||state.systemPaused,audioLevel:wallpaperAudioLevel,particles:particles.length,icons:iconLayer?iconLayer.snapshot():null};
    };
    resize();
    applyState(state);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
